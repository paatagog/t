<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Graph Navigator Bot</title>
<style>
  :root{
    --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  }
  html[data-theme="dark"]{
    --bg:#0b0d10;
    --panel:#12161b;
    --line:#232a31;
    --ink:#d7e0e6;
    --dim:#7c8891;
    --accent:#3fc9a3;
    --accent-dim:#245b4c;
    --accent-ink:#06110d;
    --user:#1c2530;
    --bot:#151b21;
    --input-bg:#0d1013;
    --edge-line:#3a4148;
    --arrow-fill:#5b6672;
    --node-stroke:#0b0d10;
    --node-label:#c9d3da;
    --ring-current:#3fc9a3;
    --ring-goal:#e2b93b;
  }
  html[data-theme="light"]{
    --bg:#f4f2ee;
    --panel:#ffffff;
    --line:#dcd7cd;
    --ink:#23272b;
    --dim:#767068;
    --accent:#0d7a63;
    --accent-dim:#dcf2ea;
    --accent-ink:#ffffff;
    --user:#eaf1ee;
    --bot:#f6f4f0;
    --input-bg:#ffffff;
    --edge-line:#c9c2b6;
    --arrow-fill:#9a9284;
    --node-stroke:#ffffff;
    --node-label:#4a453e;
    --ring-current:#0d7a63;
    --ring-goal:#b8860b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
    transition:background .15s, color .15s;
  }
  .topbar{
    width:100%;
    max-width:1080px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .topbar h1{
    font-size:14px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--dim);
    margin:0;
    font-weight:600;
  }
  .controls{display:flex; gap:8px;}
  .toggle-btn{
    background:transparent;
    color:var(--dim);
    border:1px solid var(--line);
    border-radius:4px;
    padding:6px 10px;
    font-family:var(--mono);
    font-size:12px;
    cursor:pointer;
  }
  .toggle-btn.active{
    color:var(--accent-ink);
    background:var(--accent);
    border-color:var(--accent);
  }
  .app{
    width:100%;
    max-width:1080px;
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:18px;
  }
  .app.solo{ grid-template-columns:1fr; max-width:720px; }
  @media (max-width:820px){
    .app{grid-template-columns:1fr; }
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    display:flex;
    flex-direction:column;
    min-height:560px;
    overflow:hidden;
  }
  .panel-head{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px;box-shadow:0 0 6px var(--accent);}
  #log{
    flex:1;
    overflow-y:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    font-size:14px;
    line-height:1.5;
  }
  .msg{max-width:88%; padding:9px 12px; border-radius:5px; white-space:pre-wrap;}
  .bot{background:var(--bot); border:1px solid var(--line); align-self:flex-start;}
  .user{background:var(--user); border:1px solid var(--line); align-self:flex-end;}
  .sys{align-self:center; color:var(--dim); font-size:12px; border:none;}
  .opt-list{margin-top:4px; color:var(--accent);}
  .inputbar{
    display:flex;
    border-top:1px solid var(--line);
    padding:10px;
    gap:8px;
  }
  #cmd{
    flex:1;
    background:var(--input-bg);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:4px;
    padding:10px 12px;
    font-family:var(--mono);
    font-size:14px;
    outline:none;
  }
  #cmd:focus{border-color:var(--accent);}
  button.send{
    background:var(--accent-dim);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:4px;
    padding:0 16px;
    font-family:var(--mono);
    font-size:13px;
    cursor:pointer;
  }
  button.send:hover{background:var(--accent); color:var(--accent-ink);}
  .side-body{padding:14px; overflow:auto; flex:1;}
  svg{width:100%; height:auto; display:block;}
  .legend{font-size:11px; color:var(--dim); padding:10px 14px; border-top:1px solid var(--line);}
  .legend b{color:var(--ink);}
  textarea#graphSrc{
    width:100%;
    height:150px;
    background:var(--input-bg);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--mono);
    font-size:11px;
    padding:8px;
    resize:vertical;
  }
  .loadrow{display:flex; gap:8px; margin-top:8px;}
  .loadrow button{flex:none; padding:6px 12px; font-size:12px;}
  .hint{color:var(--dim); font-size:11px; margin-top:6px;}
  .admin-badge{
    font-size:10px;
    letter-spacing:.08em;
    color:var(--ring-goal);
    border:1px solid var(--ring-goal);
    border-radius:3px;
    padding:2px 6px;
    margin-left:8px;
  }
</style>
</head>

// ---------- Parser ----------
function parseGraph(text){
  const cfg = {};
  const nodes = new Map();
  const edgesRaw = [];
  const adj = new Map();
  let start = null, goal = null;

  const lines = text.split(/\r?\n/);
  for(const raw of lines){
    const line = raw.trim();
    if(!line || line.startsWith('#')) continue;
    const tks = line.split(/\s+/);
    const kw = tks[0].toUpperCase();

    if(kw === 'CONFIG'){
      cfg[tks[1]] = tks[2];
    } else if(kw === 'START'){
      start = tks[1];
    } else if(kw === 'GOAL'){
      goal = tks[1];
    } else if(kw === 'NODE'){
      const [_, name, x, y, color] = tks;
      nodes.set(name, {x:+x, y:+y, color: color || cfg.DEFAULT_NODE_COLOR || '#888'});
      if(!adj.has(name)) adj.set(name, []);
    } else if(kw === 'EDGE'){
      const [_, a, op, b, color, weightStr] = tks;
      const weight = weightStr !== undefined ? Number(weightStr) : 1;
      edgesRaw.push({a, op, b, color: color || cfg.DEFAULT_EDGE_COLOR || '#666', weight});
      if(!adj.has(a)) adj.set(a, []);
      if(!adj.has(b)) adj.set(b, []);
      if(op === '->'){
        adj.get(a).push({to:b, weight});
      } else if(op === '--' || op === '<>'){
        adj.get(a).push({to:b, weight});
        adj.get(b).push({to:a, weight});
      } else {
        adj.get(a).push({to:b, weight});
      }
    }
  }
  return {cfg, nodes, edgesRaw, adj, start, goal};
}

// ---------- Bot state ----------
let graph = null;
let current = null;
let finished = false;

const logEl = document.getElementById('log');
const cmdEl = document.getElementById('cmd');
const statusEl = document.getElementById('statusLabel');
const graphSrcEl = document.getElementById('graphSrc');

function addMsg(text, cls){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
function addBotHTML(html){
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = html;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function neighborsOf(nodeName){
  return (graph.adj.get(nodeName) || []).slice();
}

function formatOptionsHTML(nodeName){
  const opts = neighborsOf(nodeName);
  if(opts.length === 0){
    return `<div>${t('noExit', nodeName)}</div>`;
  }
  const rows = opts.map((o,i)=>`${i+1}. ${o.to}  (${t('weightLabel')}: ${o.weight})`).join('\n');
  return `<div><b>${t('currentNodeLine', nodeName)}</b></div>` +
         `<div class="opt-list">${t('possibleMoves')}:\n${rows}</div>` +
         `<div style="margin-top:6px;color:var(--dim);font-size:12px;">${t('moveHint')}</div>`;
}

function announceCurrent(){
  statusEl.textContent = current + (finished ? t('finishedSuffix') : '');
  addBotHTML(formatOptionsHTML(current));
}

function tryMove(target){
  const opts = neighborsOf(current);
  let match = null;
  if(/^\d+$/.test(target)){
    const idx = parseInt(target,10) - 1;
    if(idx >= 0 && idx < opts.length) match = opts[idx];
  }
  if(!match){
    match = opts.find(o => o.to.toUpperCase() === target.toUpperCase());
  }
  if(!match){
    const names = opts.map(o=>o.to).join(', ') || t('noneOption');
    addMsg(t('invalidMove', names), 'bot');
    return;
  }
  current = match.to;
  addMsg(t('movedTo', current, match.weight), 'bot');

  if(graph.goal && current.toUpperCase() === graph.goal.toUpperCase()){
    finished = true;
    addMsg(t('goalReached', graph.goal), 'bot');
    statusEl.textContent = current + t('finishedSuffix');
    return;
  }
  announceCurrent();
}

function restart(){
  current = graph.start;
  finished = false;
  addMsg(t('restarted'), 'sys');
  announceCurrent();
}

function handleHelp(){
  addBotHTML(t('helpText'));
}

const HELP_WORDS = ['დახმარება','help'];
const RESTART_WORDS = ['თავიდან','restart'];
const WHERE_WORDS = ['სად ვარ','where','options','სად?'];

function handleUserInput(raw){
  const text = raw.trim();
  if(!text) return;
  addMsg(text, 'user');
  const lower = text.toLowerCase();

  if(HELP_WORDS.includes(lower)){ handleHelp(); return; }
  if(RESTART_WORDS.includes(lower)){ restart(); return; }
  if(WHERE_WORDS.includes(lower)){ announceCurrent(); return; }
  if(finished){ addMsg(t('finishedNotice'), 'bot'); return; }
  tryMove(text);
}

// ---------- Boot ----------
function loadGraphFromTextarea(){
  const text = graphSrcEl.value;
  try{
    graph = parseGraph(text);
    if(!graph.start || !graph.nodes.has(graph.start)){
      addMsg(t('startMissingError'), 'sys');
      return;
    }
    current = graph.start;
    finished = false;
    logEl.innerHTML = '';
    addMsg(t('graphLoaded'), 'sys');
    addMsg(t('startGoalInfo', graph.start, graph.goal), 'sys');
    announceCurrent();
  } catch(err){
    addMsg(t('parseError', err.message), 'sys');
  }
}

function applyAdminVisibility(){
  const appGrid = document.getElementById('appGrid');
  const adminPanel = document.getElementById('adminPanel');
  adminPanel.style.display = 'none';
  appGrid.classList.add('solo');
}

document.getElementById('sendBtn').addEventListener('click', () => {
  const v = cmdEl.value; cmdEl.value = ''; handleUserInput(v);
});
cmdEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ const v = cmdEl.value; cmdEl.value = ''; handleUserInput(v); }
});
document.getElementById('loadBtn').addEventListener('click', loadGraphFromTextarea);
document.getElementById('resetBtn').addEventListener('click', () => { if(graph) restart(); });

applyAdminVisibility();
setTheme('light');
setLang('en');
graphSrcEl.value = sampleGraphText;
loadGraphFromTextarea();
</script>
