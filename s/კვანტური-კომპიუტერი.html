<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>კვანტური კომპიუტერი — ვიზუალიზაცია</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #030712;
  --bg-panel: rgba(8, 15, 35, 0.85);
  --cyan: #00f0ff;
  --magenta: #ff00e5;
  --gold: #ffd700;
  --green: #00ff88;
  --blue: #4466ff;
  --white: #e8edf5;
  --dim: #3a4a6a;
  --glow-cyan: 0 0 20px rgba(0,240,255,0.4);
  --glow-magenta: 0 0 20px rgba(255,0,229,0.4);
  --font-display: 'Orbitron', sans-serif;
  --font-mono: 'Fira Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--white);
  font-family: var(--font-mono);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ═══ BACKGROUND PARTICLES ═══ */
#bgCanvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ═══ HEADER ═══ */
header {
  position: relative; z-index: 2;
  text-align: center;
  padding: 50px 20px 30px;
}
header h1 {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 5vw, 3.4rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--cyan), var(--magenta), var(--gold));
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradShift 4s ease infinite;
  letter-spacing: 3px;
  text-transform: uppercase;
}
header p {
  margin-top: 10px;
  color: var(--dim);
  font-size: 0.85rem;
  letter-spacing: 2px;
}
@keyframes gradShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ═══ MAIN GRID ═══ */
.container {
  position: relative; z-index: 2;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
  gap: 24px;
}

/* ═══ PANEL ═══ */
.panel {
  background: var(--bg-panel);
  border: 1px solid rgba(0,240,255,0.12);
  border-radius: 16px;
  padding: 28px;
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
  transition: border-color 0.4s, box-shadow 0.4s;
}
.panel::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
  opacity: 0.6;
}
.panel:hover {
  border-color: rgba(0,240,255,0.3);
  box-shadow: var(--glow-cyan);
}
.panel h2 {
  font-family: var(--font-display);
  font-size: 0.95rem;
  color: var(--cyan);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel h2 .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: var(--glow-cyan);
  animation: pulse 2s ease infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.7); }
}

/* ═══ BLOCH SPHERE ═══ */
.bloch-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 320px;
}
#blochCanvas {
  border-radius: 12px;
}

/* ═══ QUANTUM CIRCUIT ═══ */
#circuitCanvas {
  width: 100%;
  border-radius: 12px;
}

/* ═══ QUBIT REGISTER ═══ */
.qubit-register {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.qubit-cell {
  background: rgba(0,240,255,0.04);
  border: 1px solid rgba(0,240,255,0.15);
  border-radius: 12px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}
.qubit-cell:hover {
  border-color: var(--cyan);
  box-shadow: var(--glow-cyan);
  transform: translateY(-2px);
}
.qubit-cell.entangled {
  border-color: var(--magenta);
  box-shadow: var(--glow-magenta);
}
.qubit-cell .q-label {
  font-family: var(--font-display);
  font-size: 0.65rem;
  color: var(--dim);
  letter-spacing: 1px;
}
.qubit-cell .q-state {
  font-size: 1.6rem;
  font-weight: 700;
  margin: 8px 0 4px;
  font-family: var(--font-display);
}
.qubit-cell .q-prob {
  font-size: 0.7rem;
  color: var(--dim);
}
.qubit-cell .q-phase-ring {
  width: 40px; height: 40px;
  margin: 8px auto 0;
  border-radius: 50%;
  border: 2px solid rgba(0,240,255,0.3);
  position: relative;
}
.qubit-cell .q-phase-ring .needle {
  position: absolute;
  width: 2px; height: 18px;
  background: var(--cyan);
  left: 50%; top: 2px;
  transform-origin: bottom center;
  border-radius: 1px;
  box-shadow: var(--glow-cyan);
}

/* ═══ ENTANGLEMENT MAP ═══ */
#entanglementCanvas {
  width: 100%;
  border-radius: 12px;
}

/* ═══ CONTROLS ═══ */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}
.btn {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 10px 18px;
  border-radius: 8px;
  border: 1px solid rgba(0,240,255,0.25);
  background: rgba(0,240,255,0.06);
  color: var(--cyan);
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.btn:hover {
  background: rgba(0,240,255,0.15);
  box-shadow: var(--glow-cyan);
  transform: translateY(-1px);
}
.btn.active {
  background: rgba(0,240,255,0.2);
  border-color: var(--cyan);
}
.btn.magenta {
  border-color: rgba(255,0,229,0.3);
  color: var(--magenta);
  background: rgba(255,0,229,0.06);
}
.btn.magenta:hover {
  background: rgba(255,0,229,0.15);
  box-shadow: var(--glow-magenta);
}
.btn.gold {
  border-color: rgba(255,215,0,0.3);
  color: var(--gold);
  background: rgba(255,215,0,0.06);
}
.btn.gold:hover {
  background: rgba(255,215,0,0.15);
  box-shadow: 0 0 20px rgba(255,215,0,0.3);
}

/* ═══ PROBABILITY BARS ═══ */
.prob-bars {
  margin-top: 18px;
}
.prob-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.prob-row .state-label {
  font-size: 0.72rem;
  width: 60px;
  text-align: right;
  color: var(--dim);
  font-family: var(--font-mono);
}
.prob-row .bar-track {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.04);
  border-radius: 4px;
  overflow: hidden;
}
.prob-row .bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.23,1,0.32,1);
}
.prob-row .bar-val {
  font-size: 0.68rem;
  width: 45px;
  color: var(--dim);
}

/* ═══ LOG ═══ */
.log-area {
  max-height: 200px;
  overflow-y: auto;
  font-size: 0.72rem;
  line-height: 1.7;
  color: var(--dim);
  scrollbar-width: thin;
  scrollbar-color: var(--cyan) transparent;
}
.log-area .log-entry {
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  animation: fadeIn 0.3s ease;
}
.log-entry .timestamp {
  color: rgba(0,240,255,0.4);
  margin-right: 8px;
}
.log-entry .gate-name {
  color: var(--gold);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ═══ STATS ═══ */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.stat-box {
  background: rgba(0,240,255,0.03);
  border: 1px solid rgba(0,240,255,0.08);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}
.stat-box .stat-val {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--cyan);
}
.stat-box .stat-label {
  font-size: 0.65rem;
  color: var(--dim);
  margin-top: 4px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ═══ FULL-WIDTH PANEL ═══ */
.full-width { grid-column: 1 / -1; }

/* ═══ FOOTER ═══ */
footer {
  position: relative; z-index: 2;
  text-align: center;
  padding: 40px 20px;
  color: var(--dim);
  font-size: 0.7rem;
  letter-spacing: 1px;
}

@media (max-width: 800px) {
  .container { grid-template-columns: 1fr; }
  .qubit-register { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>
  <h1>Quantum Computer</h1>
  <p>ინტერაქტიული კვანტური სიმულატორი — 8 კუბიტი</p>
</header>

<div class="container">

  <!-- BLOCH SPHERE -->
  <div class="panel">
    <h2><span class="dot"></span>ბლოხის სფერო</h2>
    <div class="bloch-container">
      <canvas id="blochCanvas" width="340" height="300"></canvas>
    </div>
    <div class="controls" style="justify-content:center">
      <button class="btn" onclick="selectQubitForBloch(0)">Q0</button>
      <button class="btn" onclick="selectQubitForBloch(1)">Q1</button>
      <button class="btn" onclick="selectQubitForBloch(2)">Q2</button>
      <button class="btn" onclick="selectQubitForBloch(3)">Q3</button>
    </div>
  </div>

  <!-- QUBIT REGISTER -->
  <div class="panel">
    <h2><span class="dot"></span>კუბიტ რეგისტრი</h2>
    <div class="qubit-register" id="qubitRegister"></div>
    <div class="controls" style="margin-top:18px">
      <button class="btn" onclick="applyGate('H')">H Gate</button>
      <button class="btn" onclick="applyGate('X')">X Gate</button>
      <button class="btn magenta" onclick="applyGate('CNOT')">CNOT</button>
      <button class="btn gold" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <!-- QUANTUM CIRCUIT -->
  <div class="panel full-width">
    <h2><span class="dot"></span>კვანტური წრედი</h2>
    <canvas id="circuitCanvas" height="220"></canvas>
  </div>

  <!-- PROBABILITY DISTRIBUTION -->
  <div class="panel">
    <h2><span class="dot"></span>ალბათობის განაწილება</h2>
    <div class="prob-bars" id="probBars"></div>
  </div>

  <!-- ENTANGLEMENT MAP -->
  <div class="panel">
    <h2><span class="dot"></span>გადაჯაჭვულობის რუკა</h2>
    <canvas id="entanglementCanvas" height="260"></canvas>
  </div>

  <!-- STATS -->
  <div class="panel">
    <h2><span class="dot"></span>სისტემის მეტრიკა</h2>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val" id="statQubits">8</div><div class="stat-label">კუბიტი</div></div>
      <div class="stat-box"><div class="stat-val" id="statGates">0</div><div class="stat-label">გეითი</div></div>
      <div class="stat-box"><div class="stat-val" id="statEntangled">0</div><div class="stat-label">გადაჯაჭვული</div></div>
      <div class="stat-box"><div class="stat-val" id="statFidelity">100%</div><div class="stat-label">ფიდელობა</div></div>
    </div>
  </div>

  <!-- LOG -->
  <div class="panel">
    <h2><span class="dot"></span>ოპერაციების ჟურნალი</h2>
    <div class="log-area" id="logArea"></div>
  </div>

</div>

<footer>კვანტური სიმულატორი v1.0 — ვიზუალიზაცია</footer>

<script>
// ═══════════════════════════════════════
// BACKGROUND PARTICLES
// ═══════════════════════════════════════
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * bgCanvas.width,
    y: Math.random() * bgCanvas.height,
    r: Math.random() * 1.5 + 0.3,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3,
    alpha: Math.random() * 0.5 + 0.1
  });
}

function drawBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  particles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0) p.x = bgCanvas.width;
    if (p.x > bgCanvas.width) p.x = 0;
    if (p.y < 0) p.y = bgCanvas.height;
    if (p.y > bgCanvas.height) p.y = 0;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(0,240,255,${p.alpha})`;
    bgCtx.fill();
  });
  // connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < 120) {
        bgCtx.beginPath();
        bgCtx.moveTo(particles[i].x, particles[i].y);
        bgCtx.lineTo(particles[j].x, particles[j].y);
        bgCtx.strokeStyle = `rgba(0,240,255,${0.06 * (1 - d/120)})`;
        bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(drawBg);
}
drawBg();

// ═══════════════════════════════════════
// QUANTUM STATE
// ═══════════════════════════════════════
const NUM_QUBITS = 8;
let qubits = [];
let gateCount = 0;
let circuitOps = [];
let blochQubit = 0;
let time = 0;

class Qubit {
  constructor(index) {
    this.index = index;
    this.theta = 0;    // polar angle
    this.phi = 0;      // azimuthal angle
    this.entangledWith = -1;
  }
  get alpha() { return Math.cos(this.theta / 2); }
  get beta() { return Math.sin(this.theta / 2); }
  get prob0() { return this.alpha * this.alpha; }
  get prob1() { return this.beta * this.beta; }
  get stateLabel() {
    if (this.prob0 > 0.99) return '|0⟩';
    if (this.prob1 > 0.99) return '|1⟩';
    return '|ψ⟩';
  }
}

function initQubits() {
  qubits = [];
  for (let i = 0; i < NUM_QUBITS; i++) qubits.push(new Qubit(i));
  gateCount = 0;
  circuitOps = [];
  updateAll();
}

// ═══════════════════════════════════════
// GATE OPERATIONS
// ═══════════════════════════════════════
function applyGate(gate) {
  if (gate === 'H') {
    // Hadamard on selected qubit
    const q = qubits[blochQubit];
    if (q.prob0 > 0.99) { q.theta = Math.PI / 2; q.phi = 0; }
    else if (q.prob1 > 0.99) { q.theta = Math.PI / 2; q.phi = Math.PI; }
    else { q.theta = 0; q.phi = 0; }
    circuitOps.push({ gate: 'H', qubit: blochQubit });
    addLog(`H გეითი გამოყენებულია Q${blochQubit}-ზე`);
  } else if (gate === 'X') {
    const q = qubits[blochQubit];
    q.theta = Math.PI - q.theta;
    circuitOps.push({ gate: 'X', qubit: blochQubit });
    addLog(`X გეითი გამოყენებულია Q${blochQubit}-ზე`);
  } else if (gate === 'CNOT') {
    const control = blochQubit;
    const target = (blochQubit + 1) % NUM_QUBITS;
    if (qubits[control].prob1 > 0.5) {
      qubits[target].theta = Math.PI - qubits[target].theta;
    }
    qubits[control].entangledWith = target;
    qubits[target].entangledWith = control;
    circuitOps.push({ gate: 'CNOT', qubit: control, target });
    addLog(`CNOT: Q${control} → Q${target}`);
  }
  gateCount++;
  updateAll();
}

function resetAll() {
  initQubits();
  addLog('სისტემა განულებულია');
}

function selectQubitForBloch(i) {
  blochQubit = i;
  updateAll();
}

// ═══════════════════════════════════════
// UPDATE ALL VISUALS
// ═══════════════════════════════════════
function updateAll() {
  renderRegister();
  renderProbBars();
  renderStats();
  drawCircuit();
  drawEntanglement();
}

// ═══════════════════════════════════════
// QUBIT REGISTER
// ═══════════════════════════════════════
function renderRegister() {
  const container = document.getElementById('qubitRegister');
  if (qubits.length === 0) return;
  container.innerHTML = '';
  qubits.forEach((q, i) => {
    if (i >= 8) return;
    const cell = document.createElement('div');
    cell.className = 'qubit-cell' + (q.entangledWith >= 0 ? ' entangled' : '');
    if (i === blochQubit) cell.style.borderColor = '#00f0ff';
    const phaseAngle = q.phi * (180 / Math.PI);
    cell.innerHTML = `
      <div class="q-label">Q${i}</div>
      <div class="q-state" style="color:${i === blochQubit ? '#00f0ff' : '#e8edf5'}">${q.stateLabel}</div>
      <div class="q-prob">${(q.prob0*100).toFixed(1)}% | ${(q.prob1*100).toFixed(1)}%</div>
      <div class="q-phase-ring"><div class="needle" style="transform:rotate(${phaseAngle}deg)"></div></div>
    `;
    cell.onclick = () => selectQubitForBloch(i);
    container.appendChild(cell);
  });
}

// ═══════════════════════════════════════
// PROBABILITY BARS
// ═══════════════════════════════════════
function renderProbBars() {
  const container = document.getElementById('probBars');
  if (qubits.length === 0) return;
  const states = [];
  // Show top 8 basis states
  for (let i = 0; i < 16; i++) {
    let prob = 1;
    for (let b = 0; b < 4; b++) {
      const bit = (i >> (3 - b)) & 1;
      prob *= bit ? qubits[b].prob1 : qubits[b].prob0;
    }
    const label = '|' + i.toString(2).padStart(4, '0') + '⟩';
    states.push({ label, prob });
  }
  states.sort((a, b) => b.prob - a.prob);
  const top = states.slice(0, 8);
  const colors = ['#00f0ff', '#ff00e5', '#ffd700', '#00ff88', '#4466ff', '#ff6644', '#aa44ff', '#44ffcc'];
  container.innerHTML = '';
  top.forEach((s, i) => {
    const pct = (s.prob * 100).toFixed(1);
    container.innerHTML += `
      <div class="prob-row">
        <span class="state-label">${s.label}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colors[i]}"></div></div>
        <span class="bar-val">${pct}%</span>
      </div>`;
  });
}

// ═══════════════════════════════════════
// STATS
// ═══════════════════════════════════════
function renderStats() {
  document.getElementById('statGates').textContent = gateCount;
  const ent = qubits.filter(q => q.entangledWith >= 0).length;
  document.getElementById('statEntangled').textContent = ent;
  const fidelity = Math.max(85, 100 - gateCount * 0.7).toFixed(1);
  document.getElementById('statFidelity').textContent = fidelity + '%';
}

// ═══════════════════════════════════════
// LOG
// ═══════════════════════════════════════
function addLog(msg) {
  const area = document.getElementById('logArea');
  const t = new Date().toLocaleTimeString('ka-GE');
  area.innerHTML = `<div class="log-entry"><span class="timestamp">[${t}]</span> ${msg}</div>` + area.innerHTML;
}

// ═══════════════════════════════════════
// BLOCH SPHERE (3D-ish rendering)
// ═══════════════════════════════════════
const blochCvs = document.getElementById('blochCanvas');
const blochCtx = blochCvs.getContext('2d');
let blochAngle = 0;

function drawBlochSphere() {
  const w = blochCvs.width, h = blochCvs.height;
  const cx = w / 2, cy = h / 2, R = 110;
  blochCtx.clearRect(0, 0, w, h);

  blochAngle += 0.004;
  const rot = blochAngle;

  // Sphere outline
  blochCtx.beginPath();
  blochCtx.arc(cx, cy, R, 0, Math.PI * 2);
  blochCtx.strokeStyle = 'rgba(0,240,255,0.15)';
  blochCtx.lineWidth = 1;
  blochCtx.stroke();

  // Equator ellipse
  blochCtx.beginPath();
  blochCtx.ellipse(cx, cy, R, R * 0.3, 0, 0, Math.PI * 2);
  blochCtx.strokeStyle = 'rgba(0,240,255,0.12)';
  blochCtx.stroke();

  // Meridian
  blochCtx.beginPath();
  blochCtx.ellipse(cx, cy, R * 0.3, R, 0, 0, Math.PI * 2);
  blochCtx.strokeStyle = 'rgba(0,240,255,0.08)';
  blochCtx.stroke();

  // Rotated meridian
  blochCtx.save();
  blochCtx.translate(cx, cy);
  blochCtx.rotate(rot);
  blochCtx.beginPath();
  blochCtx.ellipse(0, 0, R * 0.4, R, 0, 0, Math.PI * 2);
  blochCtx.strokeStyle = 'rgba(255,0,229,0.07)';
  blochCtx.stroke();
  blochCtx.restore();

  // Axes
  // Z axis
  blochCtx.beginPath();
  blochCtx.moveTo(cx, cy - R - 15);
  blochCtx.lineTo(cx, cy + R + 15);
  blochCtx.strokeStyle = 'rgba(0,240,255,0.25)';
  blochCtx.stroke();
  blochCtx.fillStyle = '#00f0ff';
  blochCtx.font = '11px Orbitron';
  blochCtx.fillText('|0⟩', cx + 6, cy - R - 8);
  blochCtx.fillText('|1⟩', cx + 6, cy + R + 14);

  // X axis (projected)
  const xProj = Math.cos(rot);
  blochCtx.beginPath();
  blochCtx.moveTo(cx - R * xProj, cy);
  blochCtx.lineTo(cx + R * xProj, cy);
  blochCtx.strokeStyle = 'rgba(255,0,229,0.2)';
  blochCtx.stroke();

  // State vector
  const q = qubits[blochQubit];
  if (!q) { requestAnimationFrame(drawBlochSphere); return; }
  const stateX = Math.sin(q.theta) * Math.cos(q.phi + rot);
  const stateY = -Math.cos(q.theta);
  const px = cx + stateX * R;
  const py = cy + stateY * R;

  // Vector line
  blochCtx.beginPath();
  blochCtx.moveTo(cx, cy);
  blochCtx.lineTo(px, py);
  blochCtx.strokeStyle = '#ffd700';
  blochCtx.lineWidth = 2.5;
  blochCtx.stroke();
  blochCtx.lineWidth = 1;

  // Arrow tip
  blochCtx.beginPath();
  blochCtx.arc(px, py, 6, 0, Math.PI * 2);
  blochCtx.fillStyle = '#ffd700';
  blochCtx.fill();
  blochCtx.shadowColor = '#ffd700';
  blochCtx.shadowBlur = 15;
  blochCtx.fill();
  blochCtx.shadowBlur = 0;

  // Label
  blochCtx.fillStyle = 'rgba(0,240,255,0.5)';
  blochCtx.font = '10px Fira Code';
  blochCtx.fillText(`Q${blochQubit}  θ=${(q.theta/Math.PI*180).toFixed(0)}°  φ=${(q.phi/Math.PI*180).toFixed(0)}°`, 10, h - 10);

  requestAnimationFrame(drawBlochSphere);
}
// ═══════════════════════════════════════
// QUANTUM CIRCUIT DRAWING
// ═══════════════════════════════════════
function drawCircuit() {
  const cvs = document.getElementById('circuitCanvas');
  const ctx = cvs.getContext('2d');
  cvs.width = cvs.parentElement.clientWidth - 56;
  const w = cvs.width, h = cvs.height;
  ctx.clearRect(0, 0, w, h);

  const numWires = 5;
  const wireSpacing = h / (numWires + 1);
  const startX = 60, endX = w - 20;

  // Wire labels & lines
  for (let i = 0; i < numWires; i++) {
    const y = wireSpacing * (i + 1);
    ctx.beginPath();
    ctx.moveTo(startX, y);
    ctx.lineTo(endX, y);
    ctx.strokeStyle = 'rgba(0,240,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = 'rgba(0,240,255,0.5)';
    ctx.font = '11px Fira Code';
    ctx.fillText(`q${i}`, 15, y + 4);

    ctx.fillStyle = 'rgba(0,240,255,0.3)';
    ctx.fillText('|0⟩', 32, y + 4);
  }

  // Draw gates
  const gateWidth = 36;
  const maxOps = Math.min(circuitOps.length, Math.floor((endX - startX - 40) / 50));
  const recentOps = circuitOps.slice(-maxOps);

  recentOps.forEach((op, idx) => {
    const gx = startX + 40 + idx * 50;
    const gy = wireSpacing * (op.qubit + 1);

    if (op.gate === 'CNOT') {
      const ty = wireSpacing * (op.target + 1);
      // Control dot
      ctx.beginPath();
      ctx.arc(gx, gy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ff00e5';
      ctx.fill();
      // Line
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx, ty);
      ctx.strokeStyle = '#ff00e5';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Target circle
      ctx.beginPath();
      ctx.arc(gx, ty, 12, 0, Math.PI * 2);
      ctx.strokeStyle = '#ff00e5';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(gx, ty - 12);
      ctx.lineTo(gx, ty + 12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(gx - 12, ty);
      ctx.lineTo(gx + 12, ty);
      ctx.stroke();
      ctx.lineWidth = 1;
    } else {
      // Gate box
      const color = op.gate === 'H' ? '#00f0ff' : '#ffd700';
      ctx.fillStyle = `${color}15`;
      ctx.strokeStyle = `${color}80`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(gx - gateWidth/2, gy - 18, gateWidth, 36, 6);
      ctx.fill();
      ctx.stroke();
      ctx.lineWidth = 1;

      ctx.fillStyle = color;
      ctx.font = 'bold 13px Orbitron';
      ctx.textAlign = 'center';
      ctx.fillText(op.gate, gx, gy + 5);
      ctx.textAlign = 'start';
    }
  });

  // Measurement symbols at end
  for (let i = 0; i < numWires; i++) {
    const y = wireSpacing * (i + 1);
    const mx = endX - 8;
    ctx.beginPath();
    ctx.arc(mx, y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,255,136,0.3)';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mx, y + 3, 7, Math.PI, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx, y + 3);
    ctx.lineTo(mx + 4, y - 6);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════
// ENTANGLEMENT MAP
// ═══════════════════════════════════════
function drawEntanglement() {
  if (qubits.length === 0) return;
  const cvs = document.getElementById('entanglementCanvas');
  const ctx = cvs.getContext('2d');
  cvs.width = cvs.parentElement.clientWidth - 56;
  const w = cvs.width, h = cvs.height;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 40;
  const n = 8;

  // Qubit nodes positions
  const nodes = [];
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    nodes.push({ x: cx + R * Math.cos(angle), y: cy + R * Math.sin(angle) });
  }

  // Entanglement links
  const drawn = new Set();
  qubits.forEach(q => {
    if (q.entangledWith >= 0) {
      const key = [Math.min(q.index, q.entangledWith), Math.max(q.index, q.entangledWith)].join('-');
      if (!drawn.has(key)) {
        drawn.add(key);
        const a = nodes[q.index], b = nodes[q.entangledWith];
        const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        grad.addColorStop(0, 'rgba(255,0,229,0.6)');
        grad.addColorStop(1, 'rgba(0,240,255,0.6)');
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.lineWidth = 1;

        // Animated particle on link
        const t = (Date.now() % 2000) / 2000;
        const px = a.x + (b.x - a.x) * t;
        const py = a.y + (b.y - a.y) * t;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ff00e5';
        ctx.shadowColor = '#ff00e5';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  });

  // Nodes
  nodes.forEach((node, i) => {
    const isEntangled = qubits[i].entangledWith >= 0;
    const isSelected = i === blochQubit;
    const r = isSelected ? 20 : 16;
    const color = isEntangled ? '#ff00e5' : '#00f0ff';

    // Glow
    ctx.beginPath();
    ctx.arc(node.x, node.y, r + 8, 0, Math.PI * 2);
    ctx.fillStyle = isEntangled ? 'rgba(255,0,229,0.08)' : 'rgba(0,240,255,0.08)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `${color}20`;
    ctx.strokeStyle = `${color}90`;
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.fill();
    ctx.stroke();
    ctx.lineWidth = 1;

    ctx.fillStyle = color;
    ctx.font = `${isSelected ? 'bold ' : ''}11px Orbitron`;
    ctx.textAlign = 'center';
    ctx.fillText(`Q${i}`, node.x, node.y + 4);
    ctx.textAlign = 'start';
  });
}

// ═══════════════════════════════════════
// ANIMATION LOOP FOR DYNAMIC ELEMENTS
// ═══════════════════════════════════════
function animLoop() {
  if (qubits.length > 0) drawEntanglement();
  time += 0.016;
  requestAnimationFrame(animLoop);
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
initQubits();
drawBlochSphere();
animLoop();
addLog('კვანტური სიმულატორი ინიციალიზებულია — 8 კუბიტი');

// Responsive circuit redraw
window.addEventListener('resize', () => { drawCircuit(); drawEntanglement(); });
</script>
