<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>თანავარსკვლავედების რუკა</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050510;
    --bg-panel: rgba(8, 12, 30, 0.92);
    --border-glow: rgba(100, 140, 255, 0.15);
    --star-primary: #e8eaff;
    --accent-blue: #5b8def;
    --accent-cyan: #4ecdc4;
    --accent-gold: #f0c75e;
    --accent-rose: #e8637a;
    --text-primary: #d4d8f0;
    --text-secondary: #8890b5;
    --text-dim: #555a7a;
    --line-constellation: rgba(120, 160, 255, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans Georgian', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ═══ STARFIELD CANVAS ═══ */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ═══ MAIN CONSTELLATION CANVAS ═══ */
  #constellation-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* ═══ NEBULA GLOW OVERLAY ═══ */
  .nebula-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 600px 400px at 20% 30%, rgba(60, 40, 120, 0.08) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 80% 70%, rgba(30, 60, 120, 0.06) 0%, transparent 70%),
      radial-gradient(ellipse 300px 300px at 50% 50%, rgba(40, 80, 100, 0.04) 0%, transparent 70%);
  }

  /* ═══ HEADER ═══ */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    background: linear-gradient(180deg, rgba(5, 5, 16, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }

  .header > * { pointer-events: all; }

  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 38px; height: 38px;
    position: relative;
  }

  .logo-icon::before {
    content: '✦';
    font-size: 28px;
    color: var(--accent-blue);
    filter: drop-shadow(0 0 8px rgba(91, 141, 239, 0.5));
    animation: logoPulse 3s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }

  .logo-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .season-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    padding: 4px;
    backdrop-filter: blur(20px);
  }

  .season-tab {
    padding: 8px 18px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 400;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .season-tab:hover { color: var(--text-primary); }
  .season-tab.active {
    background: rgba(91, 141, 239, 0.15);
    color: var(--accent-blue);
    font-weight: 600;
  }

  /* ═══ SIDEBAR ═══ */
  .sidebar {
    position: fixed;
    left: 0; top: 80px; bottom: 0;
    width: 260px;
    z-index: 10;
    padding: 16px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--text-dim) transparent;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

  .sidebar-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding-left: 8px;
  }

  .constellation-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .constellation-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid transparent;
  }

  .constellation-item:hover {
    background: rgba(91, 141, 239, 0.06);
    border-color: var(--border-glow);
  }

  .constellation-item.active {
    background: rgba(91, 141, 239, 0.1);
    border-color: rgba(91, 141, 239, 0.3);
  }

  .constellation-item .symbol {
    width: 32px; height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    border-radius: 8px;
    background: rgba(91, 141, 239, 0.08);
    flex-shrink: 0;
  }

  .constellation-item .info {
    flex: 1;
    min-width: 0;
  }

  .constellation-item .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .constellation-item .latin {
    font-size: 10px;
    color: var(--text-secondary);
    font-style: italic;
  }

  /* ═══ INFO PANEL ═══ */
  .info-panel {
    position: fixed;
    right: 24px;
    top: 90px;
    width: 340px;
    z-index: 10;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    backdrop-filter: blur(30px);
    padding: 28px;
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--text-dim) transparent;
  }

  .info-panel.visible {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
  }

  .info-panel .close-btn {
    position: absolute;
    top: 16px; right: 16px;
    width: 28px; height: 28px;
    border: none;
    background: rgba(255,255,255,0.05);
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .info-panel .close-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-primary);
  }

  .info-header {
    margin-bottom: 20px;
  }

  .info-header .constellation-symbol {
    font-size: 36px;
    margin-bottom: 8px;
    display: block;
  }

  .info-header h2 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }

  .info-header .subtitle {
    font-size: 13px;
    color: var(--accent-blue);
    font-style: italic;
  }

  .info-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--accent-blue), transparent);
    margin: 16px 0;
    opacity: 0.3;
  }

  .info-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 12px;
  }

  .stat-card .stat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .stat-card .stat-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-cyan);
  }

  .info-description {
    font-size: 13px;
    line-height: 1.8;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .brightest-star {
    background: linear-gradient(135deg, rgba(240, 199, 94, 0.08), rgba(240, 199, 94, 0.02));
    border: 1px solid rgba(240, 199, 94, 0.15);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .brightest-star .label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent-gold);
    margin-bottom: 6px;
  }

  .brightest-star .star-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-gold);
  }

  .brightest-star .star-info {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .mythology-section h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent-rose);
    margin-bottom: 8px;
  }

  .mythology-section p {
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-secondary);
  }

  /* ═══ INSTRUCTION TOOLTIP ═══ */
  .instruction {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadeUp 1s ease 1s both;
  }

  .instruction .key {
    background: rgba(91, 141, 239, 0.15);
    color: var(--accent-blue);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 11px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ═══ STAR TOOLTIP ═══ */
  .star-tooltip {
    position: fixed;
    z-index: 20;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    backdrop-filter: blur(20px);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 11px;
    color: var(--text-primary);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .star-tooltip.visible { opacity: 1; }

  /* ═══ RESPONSIVE ═══ */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .info-panel { right: 12px; left: 12px; width: auto; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="nebula-overlay"></div>
<canvas id="constellation-canvas"></canvas>

<div class="header">
  <div class="logo">
    <div class="logo-icon"></div>
    <div class="logo-text">CONSTELLATION MAP</div>
  </div>
  <div class="season-tabs">
    <button class="season-tab active" data-season="all">ყველა</button>
    <button class="season-tab" data-season="winter">ზამთარი</button>
    <button class="season-tab" data-season="spring">გაზაფხული</button>
    <button class="season-tab" data-season="summer">ზაფხული</button>
    <button class="season-tab" data-season="autumn">შემოდგომა</button>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-section-title">თანავარსკვლავედები</div>
  <div class="constellation-list" id="constellation-list"></div>
</div>

<div class="info-panel" id="info-panel">
  <button class="close-btn" onclick="closeInfoPanel()">✕</button>
  <div id="info-content"></div>

<div class="star-tooltip" id="star-tooltip"></div>

<div class="instruction">

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let activeConstellation = null;
let activeSeason = 'all';
let hoveredStar = null;

// ═══════════════════════════════════════
//  STARFIELD BACKGROUND
// ═══════════════════════════════════════
const sfCanvas = document.getElementById('starfield');
const sfCtx = sfCanvas.getContext('2d');
let bgStars = [];

function initStarfield() {
  sfCanvas.width = window.innerWidth;
  sfCanvas.height = window.innerHeight;
  bgStars = [];
  const count = Math.floor((sfCanvas.width * sfCanvas.height) / 2500);
  for (let i = 0; i < count; i++) {
    bgStars.push({
      x: Math.random() * sfCanvas.width,
      y: Math.random() * sfCanvas.height,
      size: Math.random() * 1.3 + 0.2,
      alpha: Math.random() * 0.6 + 0.1,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2,
    });
  }
}

function drawStarfield(time) {
  sfCtx.clearRect(0, 0, sfCanvas.width, sfCanvas.height);
  for (const s of bgStars) {
    const alpha = s.alpha + Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.15;
    sfCtx.beginPath();
    sfCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    sfCtx.fillStyle = `rgba(200, 210, 255, ${Math.max(0.05, alpha)})`;
    sfCtx.fill();
  }
}

// ═══════════════════════════════════════
//  MAIN CONSTELLATION CANVAS
// ═══════════════════════════════════════
const mainCanvas = document.getElementById('constellation-canvas');
const ctx = mainCanvas.getContext('2d');

function resizeCanvas() {
  mainCanvas.width = window.innerWidth;
  mainCanvas.height = window.innerHeight;
}

function drawConstellation(c, time) {
  const offsetX = 260;
  const drawWidth = mainCanvas.width - offsetX - 380;
  const drawHeight = mainCanvas.height - 160;
  const startX = offsetX + 40;
  const startY = 100;

  // Convert relative coords to canvas coords
  const pts = c.stars.map(s => ({
    x: startX + s.x * drawWidth,
    y: startY + s.y * drawHeight,
    size: s.size,
    name: s.name,
    bright: s.bright || false,
  }));

  // Draw connection lines
  ctx.lineWidth = 1.2;
  for (const [a, b] of c.lines) {
    const pA = pts[a], pB = pts[b];
    const grad = ctx.createLinearGradient(pA.x, pA.y, pB.x, pB.y);
    grad.addColorStop(0, 'rgba(100, 150, 255, 0.25)');
    grad.addColorStop(0.5, 'rgba(100, 150, 255, 0.4)');
    grad.addColorStop(1, 'rgba(100, 150, 255, 0.25)');
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(pA.x, pA.y);
    ctx.lineTo(pB.x, pB.y);
    ctx.stroke();
  }

  // Draw stars
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const pulse = 1 + Math.sin(time * 0.002 + i) * 0.15;
    const r = p.size * pulse;

    // Outer glow
    if (p.bright) {
      const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 8);
      glowGrad.addColorStop(0, 'rgba(140, 180, 255, 0.15)');
      glowGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Inner glow
    const innerGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
    innerGrad.addColorStop(0, 'rgba(200, 220, 255, 0.3)');
    innerGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = innerGrad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
    ctx.fill();

    // Star core
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = p.bright ? '#fff' : 'rgba(220, 230, 255, 0.9)';
    ctx.fill();

    // Cross spikes for bright stars
    if (p.bright) {
      ctx.strokeStyle = `rgba(200, 220, 255, ${0.15 + pulse * 0.05})`;
      ctx.lineWidth = 0.5;
      const spikeLen = r * 5;
      ctx.beginPath();
      ctx.moveTo(p.x - spikeLen, p.y);
      ctx.lineTo(p.x + spikeLen, p.y);
      ctx.moveTo(p.x, p.y - spikeLen);
      ctx.lineTo(p.x, p.y + spikeLen);
      ctx.stroke();
    }
  }

  return pts;
}

// ═══════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════
function renderSidebar() {
  const list = document.getElementById('constellation-list');
  const filtered = activeSeason === 'all'
    ? constellations
    : constellations.filter(c => c.season === activeSeason);

  list.innerHTML = filtered.map(c => `
    <div class="constellation-item ${activeConstellation?.id === c.id ? 'active' : ''}"
         onclick="selectConstellation('${c.id}')">
      <div class="symbol">${c.symbol}</div>
      <div class="info">
        <div class="name">${c.name}</div>
        <div class="latin">${c.latin}</div>
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════
//  INFO PANEL
// ═══════════════════════════════════════
function showInfoPanel(c) {
  const panel = document.getElementById('info-panel');
  const content = document.getElementById('info-content');

  const seasonMap = { winter: 'ზამთარი', spring: 'გაზაფხული', summer: 'ზაფხული', autumn: 'შემოდგომა' };

  content.innerHTML = `
    <div class="info-header">
      <span class="constellation-symbol">${c.symbol}</span>
      <h2>${c.name}</h2>
      <div class="subtitle">${c.latin}</div>
    </div>
    <div class="info-divider"></div>
    <div class="info-stats">
      <div class="stat-card">
        <div class="stat-label">ფართობი</div>
        <div class="stat-value">${c.area} კვ.°</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">ვარსკვლავები</div>
        <div class="stat-value">${c.mainStars}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">სეზონი</div>
        <div class="stat-value">${seasonMap[c.season]}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">სიკაშკაშე</div>
        <div class="stat-value">${c.magnitude}m</div>
      </div>
    </div>
    <p class="info-description">${c.description}</p>
    <div class="brightest-star">
      <div class="label">ყველაზე ნათელი ვარსკვლავი</div>
      <div class="star-name">${c.brightestStar}</div>
      <div class="star-info">${c.brightestStarInfo}</div>
    </div>
    <div class="mythology-section">
      <h3>მითოლოგია</h3>
      <p>${c.mythology}</p>
    </div>
  `;

  panel.classList.add('visible');
}

function closeInfoPanel() {
  document.getElementById('info-panel').classList.remove('visible');
  activeConstellation = null;
  renderSidebar();
}

function selectConstellation(id) {
  activeConstellation = constellations.find(c => c.id === id);
  showInfoPanel(activeConstellation);
  renderSidebar();
}

// ═══════════════════════════════════════
//  SEASON TABS
// ═══════════════════════════════════════
document.querySelectorAll('.season-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeSeason = tab.dataset.season;
    activeConstellation = null;
    closeInfoPanel();
    renderSidebar();
  });
});

// ═══════════════════════════════════════
//  MOUSE HOVER ON STARS
// ═══════════════════════════════════════
let currentStarPts = [];
mainCanvas.addEventListener('mousemove', (e) => {
  const tooltip = document.getElementById('star-tooltip');
  let found = false;
  for (const p of currentStarPts) {
    const dx = e.clientX - p.x;
    const dy = e.clientY - p.y;
    if (Math.sqrt(dx*dx + dy*dy) < Math.max(p.size * 3, 12)) {
      tooltip.textContent = p.name;
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
      tooltip.classList.add('visible');
      found = true;
      break;
    }
  }
  if (!found) tooltip.classList.remove('visible');
});

// ═══════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════
function animate(time) {
  drawStarfield(time);

  ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

  if (activeConstellation) {
    currentStarPts = drawConstellation(activeConstellation, time);
  } else {
    currentStarPts = [];
    // Draw a subtle hint: constellation name in center
    ctx.fillStyle = 'rgba(100, 140, 200, 0.08)';
    ctx.font = '60px "Noto Sans Georgian"';
    ctx.textAlign = 'center';
    ctx.fillText('✦', mainCanvas.width / 2, mainCanvas.height / 2);
    ctx.font = '16px "Noto Sans Georgian"';
    ctx.fillStyle = 'rgba(100, 140, 200, 0.2)';
    ctx.fillText('აირჩიეთ თანავარსკვლავედი', mainCanvas.width / 2, mainCanvas.height / 2 + 40);
  }

  requestAnimationFrame(animate);
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
window.addEventListener('resize', () => {
  initStarfield();
  resizeCanvas();
});

initStarfield();
resizeCanvas();
renderSidebar();
requestAnimationFrame(animate);

// Auto-select first constellation after brief delay
setTimeout(() => selectConstellation('orion'), 800);
</script>
</body>
